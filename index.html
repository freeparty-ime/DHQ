<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幸运抽奖 - 报名参与</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .header { text-align: center; padding: 60px 20px 40px; }
        .header h1 { font-size: 36px; font-weight: bold; margin-bottom: 12px; text-shadow: 0 4px 12px rgba(0,0,0,0.3); }
        .header p { font-size: 18px; opacity: 0.8; }
        .container { max-width: 500px; margin: 0 auto; padding: 0 24px; }
        .stats { display: flex; justify-content: center; gap: 40px; margin-bottom: 40px; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 48px; font-weight: bold; color: #e94560; text-shadow: 0 0 20px rgba(233, 69, 96, 0.5); }
        .stat-label { font-size: 14px; opacity: 0.7; margin-top: 4px; }
        .form-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 32px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .form-title { font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 8px; opacity: 0.8; }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }
        .form-group input:focus { outline: none; border-color: #e94560; background: rgba(255,255,255,0.15); }
        .form-group input::placeholder { color: rgba(255,255,255,0.4); }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            color: #fff;
            box-shadow: 0 8px 24px rgba(233, 69, 96, 0.4);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(233, 69, 96, 0.5); }
        .btn-primary:disabled { background: #555; box-shadow: none; cursor: not-allowed; transform: none; }
        .success-card { text-align: center; padding: 40px 20px; }
        .success-icon { font-size: 80px; margin-bottom: 20px; }
        .success-title { font-size: 28px; font-weight: bold; margin-bottom: 12px; }
        .success-text { font-size: 16px; opacity: 0.8; line-height: 1.6; }
        .success-code {
            display: inline-block;
            background: rgba(233, 69, 96, 0.2);
            border: 2px solid #e94560;
            border-radius: 12px;
            padding: 12px 24px;
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
        }
        .error-card { text-align: center; padding: 40px 20px; background: rgba(255,0,0,0.1); border-radius: 20px; }
        .error-icon { font-size: 60px; margin-bottom: 16px; }
        .error-title { font-size: 22px; color: #ff6b6b; margin-bottom: 12px; }
        .error-text { font-size: 15px; opacity: 0.8; }
        .round-info { text-align: center; margin-bottom: 24px; padding: 16px; background: rgba(233,69,96,0.2); border-radius: 12px; }
        .round-name { font-size: 20px; font-weight: bold; color: #e94560; }
        .round-status { font-size: 14px; opacity: 0.8; margin-top: 4px; }
        .footer { text-align: center; padding: 40px 20px; opacity: 0.5; font-size: 12px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .pulse { animation: pulse 2s infinite; }
        .loading { text-align: center; padding: 40px; }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎉 幸运大抽奖</h1>
        <p>现场抽奖，公平公开</p>
    </div>
    
    <div class="container">
        <div class="stats">
            <div class="stat-item">
                <div class="stat-num" id="participantCount">-</div>
                <div class="stat-label">已报名</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" id="prizeCount">-</div>
                <div class="stat-label">奖品数</div>
            </div>
        </div>
        
        <div id="loadingArea" class="loading">
            <div class="loading-spinner"></div>
            <p>加载中...</p>
        </div>
        
        <div id="contentArea" style="display:none;">
            <div class="round-info" id="roundInfo">
                <div class="round-name" id="roundName">-</div>
                <div class="round-status" id="roundStatus">-</div>
            </div>
            
            <div id="joinForm">
                <div class="form-card">
                    <div class="form-title">📝 填写信息参与抽奖</div>
                    <div class="form-group">
                        <label>您的姓名</label>
                        <input type="text" id="userName" placeholder="请输入真实姓名" maxlength="20">
                    </div>
                    <div class="form-group">
                        <label>手机号（选填）</label>
                        <input type="tel" id="userPhone" placeholder="用于中奖后联系" maxlength="11">
                    </div>
                    <button class="btn btn-primary pulse" id="joinBtn" onclick="joinDraw()">
                        🎯 立即报名参与
                    </button>
                </div>
            </div>
            
            <div id="successCard" style="display:none;">
                <div class="form-card fade-in">
                    <div class="success-card">
                        <div class="success-icon">✅</div>
                        <div class="success-title">报名成功！</div>
                        <div class="success-text">
                            您已成功参与本次抽奖<br>
                            请留意大屏幕，祝您好运！
                        </div>
                        <div class="success-code" id="userCode">-</div>
                    </div>
                </div>
            </div>
            
            <div id="errorCard" style="display:none;">
                <div class="form-card fade-in">
                    <div class="error-card">
                        <div class="error-icon">⚠️</div>
                        <div class="error-title" id="errorTitle">提示</div>
                        <div class="error-text" id="errorText">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <p>幸运抽奖系统 · 公平公正公开</p>
    </div>

    <script>
        // ==================== Supabase 配置（需要替换） ====================
        const SUPABASE_URL = 'https://ygtkvdnholbveneqnnqs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_SHIIuCLyOprII4194oE0Rg_SbtTfmFs';
        
        // 初始化 Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // ==================== 全局状态 ====================
        let currentRound = null;
        let currentPrizes = [];
        
        // ==================== 获取设备ID ====================
        function getDeviceId() {
            let id = localStorage.getItem('lucky_draw_device_id');
            if (!id) {
                id = 'D' + Date.now() + Math.random().toString(36).substr(2, 6).toUpperCase();
                localStorage.setItem('lucky_draw_device_id', id);
            }
            return id;
        }
        
        // ==================== 初始化 ====================
        async function init() {
            try {
                // 获取当前轮次
                const { data: rounds, error: roundError } = await supabase
                    .from('rounds')
                    .select('*')
                    .neq('status', 'finished')
                    .order('created_at', { ascending: false })
                    .limit(1);
                
                if (roundError) throw roundError;
                
                if (!rounds || rounds.length === 0) {
                    showError('暂无进行中的抽奖轮次', '请等待管理员开启新的抽奖轮次');
                    return;
                }
                
                currentRound = rounds[0];
                
                // 获取奖品
                const { data: prizes, error: prizeError } = await supabase
                    .from('prizes')
                    .select('*')
                    .eq('round_id', currentRound.id)
                    .order('sort_order', { ascending: true });
                
                if (prizeError) throw prizeError;
                currentPrizes = prizes || [];
                
                // 更新显示
                updateRoundInfo();
                await updateStats();
                
                // 检查是否已报名
                await checkJoined();
                
                // 显示内容
                document.getElementById('loadingArea').style.display = 'none';
                document.getElementById('contentArea').style.display = 'block';
                
            } catch (err) {
                console.error('初始化失败:', err);
                showError('加载失败', '请检查网络连接或刷新页面重试');
            }
        }
        
        // ==================== 更新轮次信息 ====================
        function updateRoundInfo() {
            if (!currentRound) return;
            document.getElementById('roundName').textContent = currentRound.name;
            const statusMap = { joining: '正在报名', drawing: '正在抽奖', finished: '已结束' };
            document.getElementById('roundStatus').textContent = statusMap[currentRound.status] || currentRound.status;
        }
        
        // ==================== 更新统计 ====================
        async function updateStats() {
            if (!currentRound) return;
            
            try {
                // 报名人数
                const { count: participantCount } = await supabase
                    .from('round_participants')
                    .select('*', { count: 'exact', head: true })
                    .eq('round_id', currentRound.id);
                
                document.getElementById('participantCount').textContent = participantCount || 0;
                
                // 奖品数
                const totalPrizes = currentPrizes.reduce((sum, p) => sum + (parseInt(p.count) || 0), 0);
                document.getElementById('prizeCount').textContent = totalPrizes;
                
            } catch (err) {
                console.error('更新统计失败:', err);
            }
        }
        
        // ==================== 检查是否已报名 ====================
        async function checkJoined() {
            if (!currentRound) return;
            
            const deviceId = getDeviceId();
            
            try {
                // 查找该设备是否已报名当前轮次
                const { data: existing, error } = await supabase
                    .from('round_participants')
                    .select('*, participants(*)')
                    .eq('round_id', currentRound.id)
                    .eq('participants.device_id', deviceId);
                
                if (error) throw error;
                
                if (existing && existing.length > 0) {
                    showSuccess(existing[0].participants.code);
                    return;
                }
                
                // 检查是否中过奖（如果设置了排除）
                if (currentRound.exclude_previous_winners) {
                    const { data: wonBefore } = await supabase
                        .from('participants')
                        .select('*')
                        .eq('device_id', deviceId)
                        .eq('has_won', true)
                        .single();
                    
                    if (wonBefore) {
                        showError('您已中奖', '根据本轮设置，已中奖者不能参与后续轮次');
                        return;
                    }
                }
                
            } catch (err) {
                console.error('检查报名状态失败:', err);
            }
        }
        
        // ==================== 报名参与 ====================
        async function joinDraw() {
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            
            if (!name) {
                alert('请输入您的姓名！');
                return;
            }
            
            if (!currentRound) {
                alert('暂无进行中的抽奖轮次！');
                return;
            }
            
            if (currentRound.status !== 'joining') {
                alert('当前轮次不在报名阶段！');
                return;
            }
            
            const deviceId = getDeviceId();
            const btn = document.getElementById('joinBtn');
            btn.disabled = true;
            btn.textContent = '报名中...';
            
            try {
                // 检查是否已报名
                const { data: existing } = await supabase
                    .from('round_participants')
                    .select('*, participants(*)')
                    .eq('round_id', currentRound.id)
                    .eq('participants.device_id', deviceId);
                
                if (existing && existing.length > 0) {
                    showSuccess(existing[0].participants.code);
                    return;
                }
                
                // 检查是否中过奖
                if (currentRound.exclude_previous_winners) {
                    const { data: wonBefore } = await supabase
                        .from('participants')
                        .select('*')
                        .eq('device_id', deviceId)
                        .eq('has_won', true)
                        .single();
                    
                    if (wonBefore) {
                        showError('您已中奖', '根据本轮设置，已中奖者不能参与后续轮次');
                        return;
                    }
                }
                
                // 生成编号
                const { count } = await supabase
                    .from('round_participants')
                    .select('*', { count: 'exact', head: true })
                    .eq('round_id', currentRound.id);
                
                const code = 'A' + String((count || 0) + 1).padStart(3, '0');
                
                // 创建参与者
                const { data: participant, error: pError } = await supabase
                    .from('participants')
                    .insert({
                        device_id: deviceId,
                        name: name,
                        code: code,
                        phone: phone || null
                    })
                    .select()
                    .single();
                
                if (pError) throw pError;
                
                // 创建轮次报名记录
                const { error: rpError } = await supabase
                    .from('round_participants')
                    .insert({
                        round_id: currentRound.id,
                        participant_id: participant.id
                    });
                
                if (rpError) throw rpError;
                
                showSuccess(code);
                await updateStats();
                
            } catch (err) {
                console.error('报名失败:', err);
                alert('报名失败，请重试！');
                btn.disabled = false;
                btn.textContent = '🎯 立即报名参与';
            }
        }
        
        // ==================== 显示成功 ====================
        function showSuccess(code) {
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('errorCard').style.display = 'none';
            document.getElementById('successCard').style.display = 'block';
            document.getElementById('userCode').textContent = code;
        }
        
        // ==================== 显示错误 ====================
        function showError(title, text) {
            document.getElementById('loadingArea').style.display = 'none';
            document.getElementById('contentArea').style.display = 'block';
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('successCard').style.display = 'none';
            document.getElementById('errorCard').style.display = 'block';
            document.getElementById('errorTitle').textContent = title;
            document.getElementById('errorText').textContent = text;
        }
        
        // ==================== 初始化 ====================
        init();
        
        // 定时更新统计
        setInterval(updateStats, 3000);
    </script>
</body>
</html>
