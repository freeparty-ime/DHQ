<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运大抽奖 - 大屏幕</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0,0,0,0.3);
        }
        .logo { font-size: 24px; font-weight: bold; }
        .stats-bar { display: flex; gap: 30px; }
        .stat { text-align: center; }
        .stat-value { font-size: 28px; font-weight: bold; color: #e94560; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 40px;
        }
        .main-title { font-size: 48px; font-weight: bold; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .sub-title { font-size: 20px; opacity: 0.8; margin-bottom: 60px; }
        .rolling-area {
            width: 100%;
            max-width: 800px;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            border: 3px solid rgba(233, 69, 96, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 60px;
            position: relative;
            overflow: hidden;
        }
        .rolling-area::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(26,26,46,1) 0%, transparent 20%, transparent 80%, rgba(26,26,46,1) 100%);
            pointer-events: none;
            z-index: 2;
        }
        .rolling-name {
            font-size: 72px;
            font-weight: bold;
            color: #e94560;
            text-shadow: 0 0 40px rgba(233, 69, 96, 0.6);
            transition: all 0.1s;
        }
        .rolling-name.stopped {
            color: #ffd700;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.8);
            transform: scale(1.2);
        }
        .winner-display {
            display: none;
            text-align: center;
            animation: winnerShow 0.8s ease;
        }
        .winner-display.show { display: block; }
        @keyframes winnerShow {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(2deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }
        .winner-label { font-size: 24px; opacity: 0.8; margin-bottom: 16px; }
        .winner-name { font-size: 80px; font-weight: bold; color: #ffd700; text-shadow: 0 0 60px rgba(255, 215, 0, 0.8); margin-bottom: 16px; }
        .winner-code { font-size: 36px; color: #e94560; }
        .controls { display: flex; gap: 20px; margin-bottom: 40px; }
        .btn {
            padding: 20px 60px;
            border: none;
            border-radius: 16px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-start {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            color: #fff;
            box-shadow: 0 8px 32px rgba(233, 69, 96, 0.5);
        }
        .btn-start:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(233, 69, 96, 0.6); }
        .btn-stop {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            color: #333;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.5);
        }
        .btn-stop:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(255, 215, 0, 0.6); }
        .btn:disabled { background: #555; color: #999; box-shadow: none; cursor: not-allowed; transform: none; }
        .prize-info { font-size: 28px; color: #ffd700; margin-bottom: 20px; }
        .winners-list {
            position: fixed;
            right: 20px;
            top: 80px;
            width: 280px;
            max-height: 60vh;
            background: rgba(0,0,0,0.5);
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
        }
        .winners-list h3 { font-size: 16px; margin-bottom: 12px; color: #ffd700; }
        .winner-tag {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .winner-tag .name { font-weight: bold; }
        .winner-tag .prize { color: #ffd700; font-size: 12px; }
        .settings-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .settings-btn:hover { background: rgba(255,255,255,0.2); }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 32px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 { font-size: 20px; }
        .btn-close { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 8px; opacity: 0.8; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #e94560; }
        .prize-form { display: flex; gap: 8px; margin-bottom: 12px; }
        .prize-form input { flex: 1; }
        .prize-form input[type="number"] { width: 80px; flex: none; }
        .btn-small { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .btn-add { background: #e94560; color: #fff; }
        .btn-danger { background: #ff4d4f; color: #fff; }
        .prize-item-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .round-list { margin-bottom: 16px; }
        .round-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .round-item:hover { background: rgba(255,255,255,0.1); }
        .round-item.active { border: 2px solid #e94560; }
        .round-item .name { font-weight: bold; }
        .round-item .status { font-size: 12px; opacity: 0.7; }
        .empty-state { text-align: center; padding: 40px; opacity: 0.5; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .pulse { animation: pulse 1s infinite; }
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti-fall 3s linear forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .tab.active { background: #e94560; }
        .tab-content { display: none; }
        .tab-content.show { display: block; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo">🎉 幸运大抽奖</div>
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="totalParticipants">0</div>
                <div class="stat-label">已报名</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalWinners">0</div>
                <div class="stat-label">已中奖</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="remainingPrizes">0</div>
                <div class="stat-label">剩余奖品</div>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="main-title">🎊 幸运大抽奖</div>
        <div class="sub-title" id="currentPrize">准备抽取奖品...</div>

        <div class="rolling-area" id="rollingArea">
            <div class="rolling-name" id="rollingName">???</div>
        </div>

        <div class="winner-display" id="winnerDisplay">
            <div class="winner-label">🎉 恭喜中奖 🎉</div>
            <div class="winner-name" id="winnerName">-</div>
            <div class="winner-code" id="winnerCode">-</div>
        </div>

        <div class="controls" id="controls">
            <button class="btn btn-start" id="startBtn" onclick="startRolling()">▶ 开始滚动</button>
            <button class="btn btn-stop" id="stopBtn" onclick="stopRolling()" disabled>⏹ 停止抽奖</button>
        </div>

        <div class="prize-info" id="prizeInfo"></div>
    </div>

    <div class="winners-list" id="winnersList">
        <h3>🏆 中奖名单</h3>
        <div id="winnersListContent">
            <div class="empty-state">暂无中奖者</div>
        </div>
    </div>

    <button class="settings-btn" onclick="showSettings()">⚙️ 设置</button>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ 抽奖设置</h3>
                <button class="btn-close" onclick="closeSettings()">&times;</button>
            </div>

            <div class="tab-bar">
                <button class="tab active" onclick="switchTab('rounds')">轮次管理</button>
                <button class="tab" onclick="switchTab('prizes')">奖品设置</button>
                <button class="tab" onclick="switchTab('data')">数据管理</button>
            </div>

            <div class="tab-content show" id="tab-rounds">
                <div class="form-group">
                    <label>创建新轮次</label>
                    <input type="text" id="newRoundName" placeholder="轮次名称（如：第二轮）">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="excludeWinners"> 排除已中奖者
                    </label>
                </div>
                <button class="btn btn-add" style="width:100%;margin-bottom:16px;" onclick="createRound()">创建轮次</button>

                <div class="round-list" id="roundList"></div>
            </div>

            <div class="tab-content" id="tab-prizes">
                <div class="form-group">
                    <label>当前轮次</label>
                    <select id="prizeRoundSelect" onchange="loadPrizesForRound()"></select>
                </div>
                <div class="form-group">
                    <label>添加奖品</label>
                    <div class="prize-form">
                        <input type="text" id="newPrizeName" placeholder="奖品名称">
                        <input type="number" id="newPrizeCount" placeholder="数量" min="1" value="1">
                        <button class="btn-small btn-add" onclick="addPrize()">添加</button>
                    </div>
                </div>
                <div id="prizesListAdmin"></div>
            </div>

            <div class="tab-content" id="tab-data">
                <div class="form-group">
                    <label>统计信息</label>
                    <div style="background:rgba(255,255,255,0.05);padding:16px;border-radius:8px;">
                        <p>总轮次数: <span id="statRounds">0</span></p>
                        <p>总参与人数: <span id="statTotalParticipants">0</span></p>
                        <p>总中奖人数: <span id="statTotalWinners">0</span></p>
                    </div>
                </div>
                <button class="btn btn-danger" style="width:100%;" onclick="exportData()">导出数据</button>
                <button class="btn btn-danger" style="width:100%;margin-top:8px;background:#ff4d4f;" onclick="resetAll()">⚠️ 重置所有数据</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== Supabase 配置 ====================
        const SUPABASE_URL = 'https://ygtkvdnholbveneqnnqs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_SHIIuCLyOprII4194oE0Rg_SbtTfmFs';

        // 初始化 Supabase（避免变量名冲突）
        const { createClient } = window.supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==================== 全局状态 ====================
        let isRolling = false;
        let rollInterval = null;
        let currentRound = null;
        let currentParticipants = [];
        let currentPrizes = [];
        let selectedPrize = null;

        // ==================== 初始化 ====================
        async function init() {
            await loadCurrentRound();
            await loadParticipants();
            await loadWinners();
            updateStats();
        }

        // ==================== 加载当前轮次 ====================
        async function loadCurrentRound() {
            try {
                const { data: rounds, error } = await db
                    .from('rounds')
                    .select('*')
                    .neq('status', 'finished')
                    .order('created_at', { ascending: false })
                    .limit(1);

                if (error) throw error;

                if (rounds && rounds.length > 0) {
                    currentRound = rounds[0];
                    document.getElementById('currentPrize').textContent = `当前轮次: ${currentRound.name}`;

                    // 加载奖品
                    const { data: prizes } = await db
                        .from('prizes')
                        .select('*')
                        .eq('round_id', currentRound.id)
                        .order('sort_order', { ascending: true });

                    currentPrizes = prizes || [];

                    // 自动选择第一个未抽完的奖品（使用 remaining_count 字段）
                    const availablePrize = currentPrizes.find(p => p.remaining_count > 0);
                    if (availablePrize) {
                        selectedPrize = availablePrize;
                        document.getElementById('currentPrize').textContent = `正在抽取: ${availablePrize.name}`;
                    }
                } else {
                    document.getElementById('currentPrize').textContent = '暂无进行中的轮次';
                }
            } catch (err) {
                console.error('加载轮次失败:', err);
            }
        }

        // ==================== 加载参与者 ====================
        async function loadParticipants() {
            if (!currentRound) return;

            try {
                const { data, error } = await db
                    .from('round_participants')
                    .select('*, participants(*)')
                    .eq('round_id', currentRound.id);

                if (error) throw error;
                currentParticipants = data || [];
            } catch (err) {
                console.error('加载参与者失败:', err);
            }
        }

        // ==================== 加载中奖者 ====================
        async function loadWinners() {
            if (!currentRound) return;

            try {
                // winners 表没有 name 和 code 字段，需要 join participants 表获取
                const { data, error } = await db
                    .from('winners')
                    .select('*, participants(name, code)')
                    .eq('round_id', currentRound.id)
                    .order('won_at', { ascending: false });

                if (error) throw error;
                updateWinnersList(data || []);
            } catch (err) {
                console.error('加载中奖者失败:', err);
            }
        }

        // ==================== 更新统计 ====================
        async function updateStats() {
            try {
                // 报名人数
                const { count: pCount } = await db
                    .from('round_participants')
                    .select('*', { count: 'exact', head: true })
                    .eq('round_id', currentRound?.id || 0);

                document.getElementById('totalParticipants').textContent = pCount || 0;

                // 中奖人数
                const { count: wCount } = await db
                    .from('winners')
                    .select('*', { count: 'exact', head: true })
                    .eq('round_id', currentRound?.id || 0);

                document.getElementById('totalWinners').textContent = wCount || 0;

                // 剩余奖品（使用 remaining_count 字段）
                const remaining = currentPrizes.reduce((sum, p) => sum + (parseInt(p.remaining_count) || 0), 0);
                document.getElementById('remainingPrizes').textContent = remaining;

            } catch (err) {
                console.error('更新统计失败:', err);
            }
        }

        // ==================== 开始滚动 ====================
        async function startRolling() {
            if (!currentRound) {
                alert('请先创建轮次！');
                return;
            }

            if (!selectedPrize || selectedPrize.remaining_count <= 0) {
                alert('请先在设置中选择奖品！');
                showSettings();
                return;
            }

            // 重新加载参与者
            await loadParticipants();

            // 获取未中奖的参与者
            const { data: winners } = await db
                .from('winners')
                .select('participant_id')
                .eq('round_id', currentRound.id);

            const winnerIds = (winners || []).map(w => w.participant_id);
            const available = currentParticipants.filter(p => !winnerIds.includes(p.participant_id));

            if (available.length === 0) {
                alert('没有可抽奖的参与者！');
                return;
            }

            isRolling = true;

            document.getElementById('winnerDisplay').classList.remove('show');
            document.getElementById('rollingArea').style.display = 'flex';
            document.getElementById('rollingName').classList.remove('stopped');
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;

            let index = 0;
            rollInterval = setInterval(() => {
                const name = available[index % available.length].participants.name;
                document.getElementById('rollingName').textContent = name;
                index++;
            }, 80);
        }

        // ==================== 停止滚动 ====================
        async function stopRolling() {
            if (!isRolling) return;

            isRolling = false;
            clearInterval(rollInterval);

            // 获取未中奖的参与者
            const { data: winners } = await db
                .from('winners')
                .select('participant_id')
                .eq('round_id', currentRound.id);

            const winnerIds = (winners || []).map(w => w.participant_id);
            const available = currentParticipants.filter(p => !winnerIds.includes(p.participant_id));

            if (available.length === 0) return;

            // 随机选择
            const winnerIndex = Math.floor(Math.random() * available.length);
            const selected = available[winnerIndex];

            document.getElementById('rollingName').classList.add('stopped');
            document.getElementById('rollingName').textContent = selected.participants.name;

            setTimeout(async () => {
                document.getElementById('rollingArea').style.display = 'none';
                document.getElementById('winnerDisplay').classList.add('show');
                document.getElementById('winnerName').textContent = selected.participants.name;
                document.getElementById('winnerCode').textContent = '编号: ' + selected.participants.code;

                createConfetti();

                // 保存中奖记录（winners 表没有 name 和 code 字段，只有 prize_name）
                await db.from('winners').insert({
                    round_id: currentRound.id,
                    participant_id: selected.participant_id,
                    prize_id: selectedPrize.id,
                    prize_name: selectedPrize.name
                });

                // 更新奖品剩余数量（使用 remaining_count 字段）
                await db
                    .from('prizes')
                    .update({ remaining_count: selectedPrize.remaining_count - 1 })
                    .eq('id', selectedPrize.id);

                // 标记参与者已中奖
                await db
                    .from('participants')
                    .update({ has_won: true })
                    .eq('id', selected.participant_id);

                // 更新当前奖品（使用 remaining_count 字段）
                selectedPrize.remaining_count--;

                // 检查是否还有剩余
                if (selectedPrize.remaining_count <= 0) {
                    const nextPrize = currentPrizes.find(p => p.remaining_count > 0);
                    if (nextPrize) {
                        selectedPrize = nextPrize;
                        document.getElementById('currentPrize').textContent = `正在抽取: ${nextPrize.name}`;
                    } else {
                        document.getElementById('currentPrize').textContent = '所有奖品已抽完！';
                        selectedPrize = null;
                    }
                }

                await loadWinners();
                await updateStats();

                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;

            }, 500);
        }

        // ==================== 彩带特效 ====================
        function createConfetti() {
            const colors = ['#e94560', '#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = (Math.random() * 10 + 5) + 'px';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 30);
            }
        }

        // ==================== 更新中奖名单 ====================
        function updateWinnersList(winners) {
            const content = document.getElementById('winnersListContent');
            if (winners.length === 0) {
                content.innerHTML = '<div class="empty-state">暂无中奖者</div>';
                return;
            }
            content.innerHTML = winners.map(w => {
                // 从 join 的 participants 获取 name 和 code
                const pName = w.participants?.name || '-';
                const pCode = w.participants?.code || '-';
                return `
                    <div class="winner-tag">
                        <div>
                            <div class="name">${pName}</div>
                            <div style="font-size:11px;opacity:0.6;">${pCode}</div>
                        </div>
                        <div class="prize">${w.prize_name}</div>
                    </div>
                `;
            }).join('');
        }

        // ==================== 设置面板 ====================
        function showSettings() {
            document.getElementById('settingsModal').classList.add('show');
            loadRoundsList();
            loadPrizeRoundSelect();
            loadPrizesForRound();
            updateDataStats();
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('show');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('show'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('show');
        }

        // ==================== 轮次管理 ====================
        async function loadRoundsList() {
            try {
                const { data, error } = await db
                    .from('rounds')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const list = document.getElementById('roundList');
                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="empty-state">暂无轮次</div>';
                    return;
                }

                list.innerHTML = data.map(r => {
                    const statusMap = { joining: '报名中', drawing: '抽奖中', finished: '已结束' };
                    const isActive = currentRound && r.id === currentRound.id;
                    return `
                        <div class="round-item ${isActive ? 'active' : ''}" onclick="selectRound(${r.id})">
                            <div>
                                <div class="name">${r.name}</div>
                                <div class="status">${statusMap[r.status] || r.status}</div>
                            </div>
                            ${r.exclude_previous_winners ? '<span style="font-size:12px;color:#e94560;">排除已中奖</span>' : ''}
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('加载轮次失败:', err);
            }
        }

        async function createRound() {
            const name = document.getElementById('newRoundName').value.trim();
            const excludeWinners = document.getElementById('excludeWinners').checked;

            if (!name) {
                alert('请输入轮次名称');
                return;
            }

            try {
                // 结束当前轮次
                if (currentRound) {
                    await db
                        .from('rounds')
                        .update({ status: 'finished' })
                        .eq('id', currentRound.id);
                }

                // 创建新轮次
                const { data, error } = await db
                    .from('rounds')
                    .insert({
                        name: name,
                        status: 'joining',
                        exclude_previous_winners: excludeWinners
                    })
                    .select()
                    .single();

                if (error) throw error;

                currentRound = data;

                document.getElementById('newRoundName').value = '';
                document.getElementById('excludeWinners').checked = false;

                alert('轮次创建成功！');
                await loadCurrentRound();
                loadRoundsList();
                loadPrizeRoundSelect();
                loadPrizesForRound();
                updateStats();

            } catch (err) {
                console.error('创建轮次失败:', err);
                alert('创建失败，请重试');
            }
        }

        async function selectRound(roundId) {
            try {
                const { data, error } = await db
                    .from('rounds')
                    .select('*')
                    .eq('id', roundId)
                    .single();

                if (error) throw error;

                currentRound = data;
                await loadCurrentRound();
                await loadParticipants();
                await loadWinners();
                updateStats();
                loadRoundsList();

                alert(`已切换到: ${data.name}`);

            } catch (err) {
                console.error('选择轮次失败:', err);
            }
        }

        // ==================== 奖品管理 ====================
        async function loadPrizeRoundSelect() {
            try {
                const { data, error } = await db
                    .from('rounds')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const select = document.getElementById('prizeRoundSelect');
                select.innerHTML = (data || []).map(r =>
                    `<option value="${r.id}" ${currentRound && r.id === currentRound.id ? 'selected' : ''}>${r.name}</option>`
                ).join('');

            } catch (err) {
                console.error('加载轮次选择失败:', err);
            }
        }

        async function loadPrizesForRound() {
            const roundId = parseInt(document.getElementById('prizeRoundSelect').value);
            if (!roundId) return;

            try {
                const { data, error } = await db
                    .from('prizes')
                    .select('*')
                    .eq('round_id', roundId)
                    .order('sort_order', { ascending: true });

                if (error) throw error;

                const list = document.getElementById('prizesListAdmin');
                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="empty-state">暂无奖品</div>';
                    return;
                }

                // 显示已抽/总数（使用 count 和 remaining_count 计算）
                list.innerHTML = data.map(p => {
                    const drawn = p.count - p.remaining_count;
                    return `
                        <div class="prize-item-admin">
                            <span>${p.name} (${drawn}/${p.count})</span>
                            <button class="btn-small btn-danger" onclick="deletePrize(${p.id})">删除</button>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('加载奖品失败:', err);
            }
        }

        async function addPrize() {
            const roundId = parseInt(document.getElementById('prizeRoundSelect').value);
            const name = document.getElementById('newPrizeName').value.trim();
            const count = parseInt(document.getElementById('newPrizeCount').value) || 1;

            if (!roundId || !name) {
                alert('请选择轮次并输入奖品名称');
                return;
            }

            try {
                const { count: maxOrder } = await db
                    .from('prizes')
                    .select('sort_order', { count: 'exact', head: true })
                    .eq('round_id', roundId);

                await db.from('prizes').insert({
                    round_id: roundId,
                    name: name,
                    count: count,
                    remaining_count: count,
                    sort_order: (maxOrder || 0) + 1
                });

                document.getElementById('newPrizeName').value = '';
                document.getElementById('newPrizeCount').value = '1';

                loadPrizesForRound();
                if (currentRound && roundId === currentRound.id) {
                    await loadCurrentRound();
                }

            } catch (err) {
                console.error('添加奖品失败:', err);
                alert('添加失败');
            }
        }

        async function deletePrize(id) {
            if (!confirm('确定删除这个奖品吗？')) return;

            try {
                await db.from('prizes').delete().eq('id', id);
                loadPrizesForRound();
                if (currentRound) await loadCurrentRound();
            } catch (err) {
                console.error('删除奖品失败:', err);
            }
        }

        // ==================== 数据管理 ====================
        async function updateDataStats() {
            try {
                const { count: rCount } = await db.from('rounds').select('*', { count: 'exact', head: true });
                const { count: pCount } = await db.from('participants').select('*', { count: 'exact', head: true });
                const { count: wCount } = await db.from('winners').select('*', { count: 'exact', head: true });

                document.getElementById('statRounds').textContent = rCount || 0;
                document.getElementById('statTotalParticipants').textContent = pCount || 0;
                document.getElementById('statTotalWinners').textContent = wCount || 0;

            } catch (err) {
                console.error('更新统计失败:', err);
            }
        }

        async function exportData() {
            try {
                // winners 表没有 name 和 code，需要 join participants 和 rounds 获取
                const { data: winners } = await db
                    .from('winners')
                    .select('*, participants(name, code, phone), rounds(name)')
                    .order('won_at', { ascending: true });

                if (!winners || winners.length === 0) {
                    alert('暂无数据');
                    return;
                }

                let csv = '\uFEFF轮次,姓名,编号,手机号,奖品,中奖时间\n';
                winners.forEach(w => {
                    const pName = w.participants?.name || '-';
                    const pCode = w.participants?.code || '-';
                    const pPhone = w.participants?.phone || '-';
                    const rName = w.rounds?.name || '-';
                    csv += `${rName},${pName},${pCode},${pPhone},${w.prize_name},${new Date(w.won_at).toLocaleString()}\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `抽奖数据_${new Date().toISOString().slice(0,10)}.csv`;
                link.click();

            } catch (err) {
                console.error('导出失败:', err);
                alert('导出失败');
            }
        }

        async function resetAll() {
            if (!confirm('⚠️ 确定要重置所有数据吗？所有轮次、参与者、奖品、中奖记录将被清空！')) return;
            if (!confirm('⚠️ 再次确认：此操作不可恢复！')) return;
            if (!confirm('⚠️ 最后确认：确定清空所有数据？')) return;

            try {
                await db.from('winners').delete().neq('id', 0);
                await db.from('round_participants').delete().neq('id', 0);
                await db.from('prizes').delete().neq('id', 0);
                await db.from('participants').delete().neq('id', 0);
                await db.from('rounds').delete().neq('id', 0);

                // 创建默认轮次
                const { data: round } = await db
                    .from('rounds')
                    .insert({ name: '第一轮', status: 'joining' })
                    .select()
                    .single();

                currentRound = round;
                currentParticipants = [];
                currentPrizes = [];
                selectedPrize = null;

                await loadCurrentRound();
                await loadWinners();
                updateStats();
                updateDataStats();
                loadRoundsList();
                loadPrizesForRound();

                document.getElementById('currentPrize').textContent = '准备抽取奖品...';
                document.getElementById('winnerDisplay').classList.remove('show');
                document.getElementById('rollingArea').style.display = 'flex';
                document.getElementById('rollingName').textContent = '???';

                alert('数据已重置！');

            } catch (err) {
                console.error('重置失败:', err);
                alert('重置失败');
            }
        }

        // ==================== 初始化 ====================
        init();

        // 定时同步（每3秒）
        setInterval(async () => {
            await loadParticipants();
            await loadWinners();
            updateStats();
        }, 3000);

        // 点击弹窗外部关闭
        document.getElementById('settingsModal').addEventListener('click', function(e) {
            if (e.target === this) closeSettings();
        });
    </script>
</body>
</html>
