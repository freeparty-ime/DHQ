<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运大抽奖 - 大屏幕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        
        /* 顶部信息栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0,0,0,0.3);
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        
        .stats-bar {
            display: flex;
            gap: 30px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #e94560;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.7;
        }
        
        /* 主内容区 */
        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 40px;
        }
        
        /* 标题 */
        .main-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .sub-title {
            font-size: 20px;
            opacity: 0.8;
            margin-bottom: 60px;
        }
        
        /* 滚动显示区 */
        .rolling-area {
            width: 100%;
            max-width: 800px;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            border: 3px solid rgba(233, 69, 96, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 60px;
            position: relative;
            overflow: hidden;
        }
        
        .rolling-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                rgba(26,26,46,1) 0%, 
                transparent 20%, 
                transparent 80%, 
                rgba(26,26,46,1) 100%
            );
            pointer-events: none;
            z-index: 2;
        }
        
        .rolling-name {
            font-size: 72px;
            font-weight: bold;
            color: #e94560;
            text-shadow: 0 0 40px rgba(233, 69, 96, 0.6);
            transition: all 0.1s;
        }
        
        .rolling-name.stopped {
            color: #ffd700;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.8);
            transform: scale(1.2);
        }
        
        /* 中奖结果展示 */
        .winner-display {
            display: none;
            text-align: center;
            animation: winnerShow 0.8s ease;
        }
        
        .winner-display.show {
            display: block;
        }
        
        @keyframes winnerShow {
            0% {
                transform: scale(0) rotate(-10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(2deg);
            }
            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }
        
        .winner-label {
            font-size: 24px;
            opacity: 0.8;
            margin-bottom: 16px;
        }
        
        .winner-name {
            font-size: 80px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.8);
            margin-bottom: 16px;
        }
        
        .winner-code {
            font-size: 36px;
            color: #e94560;
        }
        
        /* 控制按钮 */
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .btn {
            padding: 20px 60px;
            border: none;
            border-radius: 16px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-start {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            color: #fff;
            box-shadow: 0 8px 32px rgba(233, 69, 96, 0.5);
        }
        
        .btn-start:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(233, 69, 96, 0.6);
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            color: #333;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.5);
        }
        
        .btn-stop:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(255, 215, 0, 0.6);
        }
        
        .btn:disabled {
            background: #555;
            color: #999;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 奖品信息 */
        .prize-info {
            font-size: 28px;
            color: #ffd700;
            margin-bottom: 20px;
        }
        
        /* 中奖名单 */
        .winners-list {
            position: fixed;
            right: 20px;
            top: 80px;
            width: 280px;
            max-height: 60vh;
            background: rgba(0,0,0,0.5);
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
        }
        
        .winners-list h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #ffd700;
        }
        
        .winner-tag {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .winner-tag .name {
            font-weight: bold;
        }
        
        .winner-tag .prize {
            color: #ffd700;
            font-size: 12px;
        }
        
        /* 设置面板 */
        .settings-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        
        .settings-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        /* 设置弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 32px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h3 {
            font-size: 20px;
        }
        
        .btn-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            opacity: 0.8;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #e94560;
        }
        
        .prize-form {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .prize-form input {
            flex: 1;
        }
        
        .prize-form input[type="number"] {
            width: 80px;
            flex: none;
        }
        
        .btn-small {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        
        .btn-add {
            background: #e94560;
            color: #fff;
        }
        
        .btn-danger {
            background: #ff4d4f;
            color: #fff;
        }
        
        .prize-item-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px;
            opacity: 0.5;
        }
        
        /* 动画 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse {
            animation: pulse 1s infinite;
        }
        
        /* 彩带效果 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti-fall 3s linear forwards;
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部栏 -->
    <div class="top-bar">
        <div class="logo">🎉 幸运大抽奖</div>
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="totalParticipants">0</div>
                <div class="stat-label">已报名</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalWinners">0</div>
                <div class="stat-label">已中奖</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="remainingPrizes">0</div>
                <div class="stat-label">剩余奖品</div>
            </div>
        </div>
    </div>
    
    <!-- 主内容 -->
    <div class="main">
        <div class="main-title">🎊 幸运大抽奖</div>
        <div class="sub-title" id="currentPrize">准备抽取奖品...</div>
        
        <!-- 滚动显示区 -->
        <div class="rolling-area" id="rollingArea">
            <div class="rolling-name" id="rollingName">???</div>
        </div>
        
        <!-- 中奖结果 -->
        <div class="winner-display" id="winnerDisplay">
            <div class="winner-label">🎉 恭喜中奖 🎉</div>
            <div class="winner-name" id="winnerName">-</div>
            <div class="winner-code" id="winnerCode">-</div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="controls" id="controls">
            <button class="btn btn-start" id="startBtn" onclick="startRolling()">▶ 开始滚动</button>
            <button class="btn btn-stop" id="stopBtn" onclick="stopRolling()" disabled>⏹ 停止抽奖</button>
        </div>
        
        <!-- 奖品信息 -->
        <div class="prize-info" id="prizeInfo"></div>
    </div>
    
    <!-- 中奖名单 -->
    <div class="winners-list" id="winnersList">
        <h3>🏆 中奖名单</h3>
        <div id="winnersListContent">
            <div class="empty-state">暂无中奖者</div>
        </div>
    </div>
    
    <!-- 设置按钮 -->
    <button class="settings-btn" onclick="showSettings()">⚙️ 设置</button>
    
    <!-- 设置弹窗 -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ 抽奖设置</h3>
                <button class="btn-close" onclick="closeSettings()">&times;</button>
            </div>
            <div class="form-group">
                <label>当前抽取奖品</label>
                <select id="selectPrize" onchange="changePrize()">
                    <option value="">请选择奖品</option>
                </select>
            </div>
            <div class="form-group">
                <label>添加奖品</label>
                <div class="prize-form">
                    <input type="text" id="newPrizeName" placeholder="奖品名称">
                    <input type="number" id="newPrizeCount" placeholder="数量" min="1" value="1">
                    <button class="btn-small btn-add" onclick="addPrize()">添加</button>
                </div>
            </div>
            <div id="prizesListAdmin"></div>
            <hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:20px 0;">
            <button class="btn btn-danger" style="width:100%;" onclick="resetAll()">重置所有数据</button>
        </div>
    </div>

    <script>
        // ==================== 数据存储 ====================
        const Storage = {
            get(key) {
                const data = localStorage.getItem('lucky_draw_' + key);
                return data ? JSON.parse(data) : null;
            },
            set(key, value) {
                localStorage.setItem('lucky_draw_' + key, JSON.stringify(value));
            }
        };
        
        // ==================== 全局状态 ====================
        let isRolling = false;
        let rollInterval = null;
        let currentPrizeId = null;
        let selectedWinner = null;
        
        // ==================== 初始化 ====================
        function init() {
            if (!Storage.get('participants')) {
                Storage.set('participants', []);
            }
            if (!Storage.get('winners')) {
                Storage.set('winners', []);
            }
            if (!Storage.get('prizes')) {
                Storage.set('prizes', [
                    { id: 1, name: '🎁 一等奖', count: 1, drawn: 0 },
                    { id: 2, name: '🥈 二等奖', count: 3, drawn: 0 },
                    { id: 3, name: '🥉 三等奖', count: 5, drawn: 0 }
                ]);
            }
            updateStats();
            updateWinnersList();
            updatePrizeSelect();
        }
        
        // ==================== 更新统计 ====================
        function updateStats() {
            const participants = Storage.get('participants') || [];
            const winners = Storage.get('winners') || [];
            const prizes = Storage.get('prizes') || [];
            
            document.getElementById('totalParticipants').textContent = participants.length;
            document.getElementById('totalWinners').textContent = winners.length;
            
            const remaining = prizes.reduce((sum, p) => sum + ((parseInt(p.count) || 0) - (parseInt(p.drawn) || 0)), 0);
            document.getElementById('remainingPrizes').textContent = remaining;
        }
        
        // ==================== 更新奖品选择 ====================
        function updatePrizeSelect() {
            const prizes = Storage.get('prizes') || [];
            const select = document.getElementById('selectPrize');
            const currentValue = select.value;
            
            select.innerHTML = '<option value="">请选择奖品</option>' +
                prizes.filter(p => p.drawn < p.count).map(p => 
                    `<option value="${p.id}">${p.name} (剩余 ${p.count - p.drawn}/${p.count})</option>`
                ).join('');
            
            if (currentValue) select.value = currentValue;
            
            // 更新奖品列表
            document.getElementById('prizesListAdmin').innerHTML = prizes.map(p => `
                <div class="prize-item-admin">
                    <span>${p.name} (${p.drawn}/${p.count})</span>
                    <button class="btn-small btn-danger" onclick="deletePrize(${p.id})">删除</button>
                </div>
            `).join('');
        }
        
        // ==================== 改变当前奖品 ====================
        function changePrize() {
            const prizeId = parseInt(document.getElementById('selectPrize').value);
            if (!prizeId) {
                currentPrizeId = null;
                document.getElementById('currentPrize').textContent = '准备抽取奖品...';
                return;
            }
            
            const prizes = Storage.get('prizes') || [];
            const prize = prizes.find(p => p.id === prizeId);
            if (prize) {
                currentPrizeId = prizeId;
                document.getElementById('currentPrize').textContent = `正在抽取：${prize.name}`;
            }
        }
        
        // ==================== 开始滚动 ====================
        function startRolling() {
            const participants = Storage.get('participants') || [];
            const winners = Storage.get('winners') || [];
            
            // 检查是否有奖品
            if (!currentPrizeId) {
                alert('请先选择要抽取的奖品！\n点击左下角"设置"选择奖品');
                return;
            }
            
            // 检查是否还有剩余
            const prizes = Storage.get('prizes') || [];
            const prize = prizes.find(p => p.id === currentPrizeId);
            if (!prize || prize.drawn >= prize.count) {
                alert('该奖品已抽完！');
                return;
            }
            
            // 获取未中奖的参与者
            const available = participants.filter(p => 
                !winners.some(w => w.participantId === p.id)
            );
            
            if (available.length === 0) {
                alert('没有可抽奖的参与者！\n请让更多人扫码报名。');
                return;
            }
            
            isRolling = true;
            selectedWinner = null;
            
            // 隐藏结果，显示滚动
            document.getElementById('winnerDisplay').classList.remove('show');
            document.getElementById('rollingArea').style.display = 'flex';
            document.getElementById('rollingName').classList.remove('stopped');
            
            // 按钮状态
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            // 开始滚动
            let index = 0;
            rollInterval = setInterval(() => {
                const name = available[index % available.length].name;
                document.getElementById('rollingName').textContent = name;
                index++;
            }, 80);
        }
        
        // ==================== 停止滚动 ====================
        function stopRolling() {
            if (!isRolling) return;
            
            isRolling = false;
            clearInterval(rollInterval);
            
            const participants = Storage.get('participants') || [];
            const winners = Storage.get('winners') || [];
            const prizes = Storage.get('prizes') || [];
            
            // 获取未中奖的参与者
            const available = participants.filter(p => 
                !winners.some(w => w.participantId === p.id)
            );
            
            if (available.length === 0) return;
            
            // 随机选择中奖者
            const winnerIndex = Math.floor(Math.random() * available.length);
            selectedWinner = available[winnerIndex];
            
            // 显示结果
            document.getElementById('rollingName').classList.add('stopped');
            document.getElementById('rollingName').textContent = selectedWinner.name;
            
            setTimeout(() => {
                document.getElementById('rollingArea').style.display = 'none';
                document.getElementById('winnerDisplay').classList.add('show');
                document.getElementById('winnerName').textContent = selectedWinner.name;
                document.getElementById('winnerCode').textContent = '编号: ' + selectedWinner.code;
                
                // 彩带效果
                createConfetti();
                
                // 记录中奖
                const prize = prizes.find(p => p.id === currentPrizeId);
                winners.push({
                    id: Date.now(),
                    participantId: selectedWinner.id,
                    name: selectedWinner.name,
                    code: selectedWinner.code,
                    prizeId: currentPrizeId,
                    prizeName: prize ? prize.name : '',
                    drawnAt: new Date().toISOString()
                });
                
                // 更新奖品已抽数量
                if (prize) {
                    prize.drawn++;
                }
                
                Storage.set('winners', winners);
                Storage.set('prizes', prizes);
                
                updateStats();
                updateWinnersList();
                updatePrizeSelect();
                
                // 按钮状态
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                
                // 检查是否还有剩余
                if (prize && prize.drawn >= prize.count) {
                    document.getElementById('currentPrize').textContent = `${prize.name} 已抽完！`;
                    currentPrizeId = null;
                    document.getElementById('selectPrize').value = '';
                }
            }, 500);
        }
        
        // ==================== 彩带效果 ====================
        function createConfetti() {
            const colors = ['#e94560', '#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = (Math.random() * 10 + 5) + 'px';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 30);
            }
        }
        
        // ==================== 更新中奖名单 ====================
        function updateWinnersList() {
            const winners = Storage.get('winners') || [];
            const content = document.getElementById('winnersListContent');
            
            if (winners.length === 0) {
                content.innerHTML = '<div class="empty-state">暂无中奖者</div>';
                return;
            }
            
            content.innerHTML = winners.slice().reverse().map(w => `
                <div class="winner-tag">
                    <div>
                        <div class="name">${w.name}</div>
                        <div style="font-size:11px;opacity:0.6;">${w.code}</div>
                    </div>
                    <div class="prize">${w.prizeName}</div>
                </div>
            `).join('');
        }
        
        // ==================== 设置面板 ====================
        function showSettings() {
            document.getElementById('settingsModal').classList.add('show');
            updatePrizeSelect();
        }
        
        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('show');
        }
        
        function addPrize() {
            const name = document.getElementById('newPrizeName').value.trim();
            const count = parseInt(document.getElementById('newPrizeCount').value) || 1;
            
            if (!name) {
                alert('请输入奖品名称');
                return;
            }
            
            const prizes = Storage.get('prizes') || [];
            prizes.push({
                id: Date.now(),
                name,
                count,
                drawn: 0
            });
            
            Storage.set('prizes', prizes);
            document.getElementById('newPrizeName').value = '';
            document.getElementById('newPrizeCount').value = '1';
            updatePrizeSelect();
            updateStats();
        }
        
        function deletePrize(id) {
            if (!confirm('确定删除这个奖品吗？')) return;
            const prizes = Storage.get('prizes') || [];
            Storage.set('prizes', prizes.filter(p => p.id !== id));
            updatePrizeSelect();
            updateStats();
        }
        
        function resetAll() {
            if (!confirm('确定要重置所有数据吗？所有报名记录和中奖记录将被清空！')) return;
            if (!confirm('再次确认：此操作不可恢复！')) return;
            
            Storage.set('participants', []);
            Storage.set('winners', []);
            Storage.set('prizes', [
                { id: 1, name: '🎁 一等奖', count: 1, drawn: 0 },
                { id: 2, name: '🥈 二等奖', count: 3, drawn: 0 },
                { id: 3, name: '🥉 三等奖', count: 5, drawn: 0 }
            ]);
            
            currentPrizeId = null;
            updateStats();
            updateWinnersList();
            updatePrizeSelect();
            document.getElementById('currentPrize').textContent = '准备抽取奖品...';
            document.getElementById('winnerDisplay').classList.remove('show');
            document.getElementById('rollingArea').style.display = 'flex';
            document.getElementById('rollingName').textContent = '???';
            
            alert('数据已重置！');
        }
        
        // ==================== 键盘快捷键 ====================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRolling) {
                    stopRolling();
                } else {
                    startRolling();
                }
            }
        });
        
        // ==================== 定时同步 ====================
        setInterval(() => {
            updateStats();
            updateWinnersList();
        }, 2000);
        
        // ==================== 初始化 ====================
        init();
        
        // 点击弹窗外部关闭
        document.getElementById('settingsModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeSettings();
            }
        });
    </script>
</body>
</html>
